<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let p = {};
        try {
          p =
            JSON.parse(localStorage.getItem("noponto-site-preferences")) || {};
        } catch {}
        const r = document.documentElement;
        r.dataset.theme = ["light", "dark"].includes(p.theme)
          ? p.theme
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        r.dataset.motion =
          p.motion === "reduce" ||
          matchMedia("(prefers-reduced-motion: reduce)").matches
            ? "reduce"
            : "full";
        r.dataset.text = ["large", "larger"].includes(p.text)
          ? p.text
          : "standard";
      })();
    </script>
    <meta name="theme-color" content="#FFC107" />
    <title>NoPonto — O transporte do Rio, mais perto de você</title>
    <meta
      name="description"
      content="Linhas, veículos, paradas e estimativas de chegada do transporte do Rio. Conheça o NoPonto e baixe o aplicativo beta para Android."
    />
    <link rel="icon" href="%BASE_URL%images/logo.webp" />
    <link
      rel="canonical"
      href="https://uvaestudantes.github.io/noponto-website/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta
      property="og:title"
      content="NoPonto — O transporte do Rio, mais perto de você"
    />
    <meta
      property="og:description"
      content="Menos incerteza no ponto. Mais cidade no seu caminho. Conheça e baixe o NoPonto para Android."
    />
    <meta
      property="og:url"
      content="https://uvaestudantes.github.io/noponto-website/"
    />
    <meta
      property="og:image"
      content="https://uvaestudantes.github.io/noponto-website/images/social.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
